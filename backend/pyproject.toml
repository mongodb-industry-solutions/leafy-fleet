[tool.poetry]
name = "leafy-fleet-backend"
version = "1.0.0"
description = "Unified backend services for Leafy Fleet"
authors = ["MongoDB Industry Solutions <industry-solutions@mongodb.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.11"
uvicorn = "^0.32.1"
motor = "^3.7.0"
pymongo = "^4.11.2"
pydantic = "^2.10.6"
pydantic-settings = "^2.10.1"
python-dotenv = "^1.0.1"
boto3 = "^1.37.11"
botocore = "^1.37.11"
langchain = "^0.3.20"
langchain-aws = "^0.2.15"
langchain-core = "^0.3.44"
langchain-mongodb = "^0.5.0"
langchain-text-splitters = "^0.3.6"
langgraph = "^0.3.7"
langgraph-checkpoint = "^2.0.18"
langgraph-checkpoint-mongodb = "^0.1.1"
langgraph-prebuilt = "^0.1.2"
langgraph-sdk = "^0.1.55"
langsmith = "^0.3.13"
voyageai = "^0.3.3"
websockets = "^15.0.1"
pandas = "^2.2.3"
numpy = "^1.26.4"
requests = "^2.32.3"
sqlalchemy = "^2.0.39"
shapely = "^2.1.1"
aiohttp = "^3.12.15"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
