# Leafy Fleet - Production Environment Configuration
# This configuration deploys frontend + backend as a single pod with sidecar pattern

# Frontend environment variables
env:
  NODE_ENV: production

  # Backend services accessible via loopback (127.0.0.1)
  NEXT_PUBLIC_AGENT_SERVICE_URL: 127.0.0.1:9000
  NEXT_PUBLIC_TIMESERIES_GET_SERVICE_URL: 127.0.0.1:9001
  NEXT_PUBLIC_TIMESERIES_POST_SERVICE_URL: 127.0.0.1:9002
  NEXT_PUBLIC_SESSIONS_SERVICE_URL: 127.0.0.1:9003
  NEXT_PUBLIC_GEOFENCE_SERVICE_URL: 127.0.0.1:9004
  NEXT_PUBLIC_STATIC_SERVICE_URL: 127.0.0.1:9005
  NEXT_PUBLIC_SIMULATION_SERVICE_URL: 127.0.0.1:9006

# Frontend secrets
envSecrets:
  # Add any frontend-specific secrets here if needed

# Backend sidecar container (runs all 7 backend services)
sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/leafy-fleet-backend-prod:latest

    ports:
      - containerPort: 9000
        name: agent
      - containerPort: 9001
        name: ts-get
      - containerPort: 9002
        name: ts-post
      - containerPort: 9003
        name: sessions
      - containerPort: 9004
        name: geofence
      - containerPort: 9005
        name: static
      - containerPort: 9006
        name: simulation

    env:
      # MongoDB connection
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: leafy-fleet-secrets-prod
            key: MONGODB_URI

      - name: APP_NAME
        value: "leafy_fleet"

      - name: AWS_REGION
        value: "us-east-1"

      - name: VOYAGE_API_KEY
        valueFrom:
          secretKeyRef:
            name: leafy-fleet-secrets-prod
            key: VOYAGE_API_KEY

      - name: STATIC_SERVICE_ENDPOINT
        value: "http://127.0.0.1:9005"

      - name: TIMESERIES_POST_ENDPOINT
        value: "http://127.0.0.1:9002"

      - name: GEOFENCES_SERVICE_ENDPOINT
        value: "http://127.0.0.1:9004"

      - name: ORIGINS
        value: "http://127.0.0.1:8080,https://leafy-fleet.industrysolutions.prod.corp.mongodb.com"

      - name: PYTHONUNBUFFERED
        value: "1"

# Production service account with AWS IRSA
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"
